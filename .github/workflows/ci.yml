# Builds and tests every change on Windows, macOS and Linux (spec 001).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pull requests build a temporary merge commit; identify builds by the
  # commit the author actually pushed.
  SPIDERLENS_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The desktop crate embeds the built UI at compile time.
      - name: Build UI
        run: pnpm --filter spiderlens-ui build

      # Spec 014 (T002): which browser each runner offers for the rendering
      # tests. Informational only; T074 makes it binding.
      - name: Browser for rendering tests
        shell: bash
        continue-on-error: true
        run: |
          {
            echo "### Browser for rendering tests (${{ matrix.os }})"
            echo
            if out="$(bash scripts/find-browser.sh 2>&1)"; then
              echo '```'
              echo "$out"
              echo '```'
            else
              echo "None found. $out"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Engine has no UI dependencies (principle III)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for crate in spiderlens-engine spiderlens-render; do
            if cargo tree -p "$crate" -e normal --prefix none | grep -E '^(tauri|wry|tao)[ -]'; then
              echo "::error::$crate must not depend on Tauri"
              exit 1
            fi
          done

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # ts-rs regenerates ui/src/generated during the tests; a diff means a
      # Rust type changed without committing the new TypeScript.
      - name: Generated TypeScript types are current
        if: runner.os == 'Linux'
        run: git diff --exit-code -- ui/src/generated

      - name: UI tests
        run: pnpm test

  # The UI in a real browser (ui/e2e): layout, scrolling, keys and pointer,
  # over the in-memory transport. No Rust needed.
  e2e:
    name: UI end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter spiderlens-ui exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter spiderlens-ui test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          retention-days: 14
          path: |
            ui/playwright-report
            ui/test-results

  # Reduced crawl benchmark (spec 008 FR-034): throughput against a build
  # of the base branch on the same machine, plus the speed caps and 429
  # handling checked from the test site's own counters.
  bench:
    name: Crawl benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
          workspaces: |
            . -> target
            base -> target

      - name: Build
        run: cargo build --release -p spiderlens -p spiderlens-test-fixtures

      - name: Build base branch CLI
        if: github.event_name == 'pull_request'
        run: cargo build --release -p spiderlens --manifest-path base/Cargo.toml

      - name: Benchmark
        shell: bash
        run: |
          base=()
          if [ -x base/target/release/spiderlens ]; then
            base=(--base-cli base/target/release/spiderlens)
          fi
          target/release/bench-check --cli target/release/spiderlens "${base[@]}" \
            --pages 20000 --runs 5 | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            # Cross-compiled on Apple Silicon; the launch check runs under Rosetta.
            os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
          - name: linux-x64
            # Older glibc so the AppImage runs on more distributions.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build CLI
        run: cargo build --release -p spiderlens --target ${{ matrix.target }}

      - name: Package CLI
        shell: bash
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/release/spiderlens
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/spiderlens-cli-${{ matrix.name }}.zip" "./$bin.exe"
          else
            tar -czf "dist/spiderlens-cli-${{ matrix.name }}.tar.gz" -C "$(dirname "$bin")" spiderlens
          fi

      - name: Launch check
        shell: bash
        run: |
          expected="${SPIDERLENS_BUILD_SHA:0:7}.${{ github.run_number }}"
          bash scripts/launch-check.sh ${{ matrix.target }} "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: spiderlens-desktop-${{ matrix.name }}
          retention-days: 90
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: spiderlens-cli-${{ matrix.name }}
          retention-days: 90
          if-no-files-found: error
          path: dist/*
