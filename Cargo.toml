[workspace]
resolver = "3"
members = ["crates/config", "crates/engine", "crates/results", "crates/mcp", "crates/spell", "crates/compare", "crates/integrations", "crates/aeo", "crates/schedule", "crates/cli", "crates/test-fixtures", "app/src-tauri"]
# `cargo test` without --workspace skips the desktop app, which needs
# webview system libraries. CI always uses --workspace.
exclude = ["tools/serp-widths"]
default-members = ["crates/config", "crates/engine", "crates/results", "crates/mcp", "crates/spell", "crates/compare", "crates/integrations", "crates/aeo", "crates/schedule", "crates/cli", "crates/test-fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Ryware/spiderlens"
authors = ["Ryware"]

[workspace.dependencies]
spiderlens-config = { path = "crates/config" }
spiderlens-engine = { path = "crates/engine" }
spiderlens-results = { path = "crates/results" }
spiderlens-mcp = { path = "crates/mcp" }
spiderlens-compare = { path = "crates/compare" }
spiderlens-aeo = { path = "crates/aeo" }
spiderlens-schedule = { path = "crates/schedule" }
spiderlens-spell = { path = "crates/spell" }
spiderlens-test-fixtures = { path = "crates/test-fixtures" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "cookies"] }
cookie_store = { version = "0.22", default-features = false }
cookie = "0.18"
url = { version = "2", features = ["serde"] }
scraper = "0.24"
html5ever = "0.35"
ego-tree = "0.10"
zstd = "0.13"
lopdf = { version = "0.42", default-features = false }
pdf-extract = "0.12.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
fs4 = "0.13"
quick-xml = "0.42"
flate2 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
psl = "2"
csv = "1"
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
calamine = "0.36"
serde_ignored = "0.1"
secrecy = { version = "0.10", features = ["serde"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
jiff = { version = "0.2", features = ["serde"] }
fastrand = "2"
dirs = "7"
proptest = "1"
tempfile = "3"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
assert_cmd = "2"
predicates = "3"
unicode-segmentation = "1"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
jsonschema = { version = "0.33", default-features = false }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "macros"] }
schemars = "1"
sxd-document = "0.3"
sxd-xpath = "0.4"
serde_json_path = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
spiderlens-integrations = { path = "crates/integrations" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
