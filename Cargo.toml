[workspace]
resolver = "3"
members = ["crates/config", "crates/engine", "crates/results", "crates/cli", "crates/test-fixtures", "app/src-tauri"]
# `cargo test` without --workspace skips the desktop app, which needs
# webview system libraries. CI always uses --workspace.
default-members = ["crates/config", "crates/engine", "crates/results", "crates/cli", "crates/test-fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Ryware/spiderlens"
authors = ["Ryware"]

[workspace.dependencies]
spiderlens-config = { path = "crates/config" }
spiderlens-engine = { path = "crates/engine" }
spiderlens-results = { path = "crates/results" }
spiderlens-test-fixtures = { path = "crates/test-fixtures" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli"] }
url = { version = "2", features = ["serde"] }
scraper = "0.24"
html5ever = "0.35"
ego-tree = "0.10"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
quick-xml = "0.42"
flate2 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
psl = "2"
csv = "1"
serde_ignored = "0.1"
secrecy = { version = "0.10", features = ["serde"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
jiff = { version = "0.2", features = ["serde"] }
proptest = "1"
tempfile = "3"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
assert_cmd = "2"
predicates = "3"
jsonschema = { version = "0.33", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
