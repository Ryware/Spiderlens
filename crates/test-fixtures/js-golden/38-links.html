<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Links {i}</title>
</head>
<body>
<h1>Link list {i}</h1><nav id="nav"></nav>
<script>
var hrefs = ['https://links.example.org/x3', 'https://links.example.org/y3?a=1&b=2', 'https://links.example.org/z3#part', '/local/3', 'relative-3.html'];
var nav = document.getElementById('nav');
hrefs.forEach(function (h) {
  var a = document.createElement('a');
  a.setAttribute('href', h);
  a.textContent = 'Go to ' + h;
  nav.appendChild(a);
});
</script>
</body>
</html>
