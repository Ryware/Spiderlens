<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Element {i}</title>
</head>
<body>
<x-card></x-card>
<script>
class XCard extends HTMLElement {
  connectedCallback() {
    this.innerHTML = '<h1>Card 3</h1><h2>Card body 3</h2><a href="https://links.example.org/card/3">Open card</a>';
  }
}
customElements.define('x-card', XCard);
</script>
</body>
</html>
